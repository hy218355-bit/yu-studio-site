<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yu Studio</title>
<meta name="description" content="Yu Studio は個人開発でアプリを作っています。" />
<link rel="icon" href="data:," />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
</style>
</head>
<body class="bg-[#f4eee1] text-[#2c2620] antialiased">

<main class="max-w-3xl mx-auto px-6 py-16">

  <header class="mb-16">
    <div class="serif text-2xl tracking-wide">Yu Studio</div>
    <div class="text-sm text-[#9a8e76] mt-2">個人開発のアプリスタジオ</div>
  </header>

  <section class="mb-16">
    <h1 class="serif text-3xl mb-4 leading-snug">小さく、長く遊べるものを。</h1>
    <p class="text-[#5a5448] leading-relaxed">
      ひとりで作って、ひとりで磨いて、毎日使えるものを。Yu Studio はそんな個人開発スタジオです。
    </p>
  </section>

  <section class="mb-16">
    <h2 class="serif text-xl mb-6 border-b border-[#d9cdb2] pb-2">アプリ</h2>

    <a href="/studyquest/" class="block group">
      <div class="bg-white border border-[#e3d8c0] rounded-lg p-6 hover:border-[#c9a24a] transition">
        <div class="flex items-start gap-4">
          <div class="w-14 h-14 rounded-xl bg-[#f4eee1] border border-[#d9cdb2] flex items-center justify-center shrink-0">
            <span class="serif text-xl text-[#c9a24a]">SQ</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-medium text-lg">StudyQuest</div>
            <div class="text-sm text-[#9a8e76] mt-1">勉強時間がそのまま冒険になる、RPG学習アプリ。</div>
            <div class="text-xs text-[#c9a24a] mt-3 group-hover:underline">詳しく見る →</div>
          </div>
        </div>
      </div>
    </a>
  </section>

  <footer class="border-t border-[#d9cdb2] pt-8 mt-24 text-sm text-[#9a8e76]">
    <div class="flex justify-between items-end flex-wrap gap-2">
      <div>© Yu Studio</div>
      <div class="space-x-4">
        <a href="/studyquest/" class="hover:text-[#2c2620]">StudyQuest</a>
      </div>
    </div>
  </footer>

</main>

</body>
</html>
